name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装根目录依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装根目录依赖
        run: npm ci

      - name: 安装 server 依赖
        run: cd server && npm ci

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build
